notes: |
  Human-verified 2026-10-31: HTTP 200. The page calls it "the most comprehensive global collection of voter turnout statistics from presidential and parliamentary elections since 1945", including European Parliament elections, with an "Export data" option. The footer reads "© 2026 International IDEA. All Rights Reserved" and links a "Release Agreement Form", so this is not open-licensed. It is cataloged for authority; reusers should read IDEA's terms. Jurisdiction is multilateral because International IDEA is an intergovernmental organization of member states. The export formats and the release-agreement requirement weren't checked.
