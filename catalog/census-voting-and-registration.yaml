notes: |
  Human-verified 2026-10-31: HTTP 200. The page says "For every national election since 1964, we collected data on the characteristics of American voters". The tables page lists "Voting and Registration in the Election of November 2024" (April 2025). It notes "The P20 detailed tables are released every two years following national level elections" and that tables come in XLS, CSV, and PDF. Releases follow the two-year election cycle; the schema has no biennial value, so cadence is irregular.
