notes: |
  Human-verified 2026-11-01 in headless Chromium: HTTP 200 for https://lda.gov/api/. The issue's https://lda.senate.gov/ now belongs to LDA.gov: lda.senate.gov/api/ answers a 301 to https://lda.gov/api/. The roots lda.senate.gov and lda.gov returned the Senate's "Senate.gov - Unauthorized" bot block (403) to curl and to headless Chromium, so the API landing page, which answered, is cataloged. It says "A researcher who is interested in downloading the lobbying documents database may do so by utilizing our REST API" and covers LD-1/LD-2 and LD-203 (the contributions database starts with filings due "by July 30, 2008"). An anonymous request to https://lda.gov/api/v1/filings/?page_size=1 returned HTTP 200 JSON with "count":2002757; the oldest filing returned was a 1999 mid-year report, linked as a PDF document. The search interface on the root was not seen because of the block.
  Licence checked 2026-11-01: the API Terms of Service (https://lda.gov/api/tos/, last modified August 22nd, 2019) say "Data accessed through LDA.gov do not, and should not, include controls over its end use", ask users to "cite the date that data were accessed or retrieved", and require the statement "Senate Office of Public Records cannot vouch for the data or analyses derived from these data after the data have been retrieved from LDA.gov"; users "may not modify or falsely represent content accessed through LDA.gov and still cite the source as LDA.gov". The filings are written by registrants; no public-domain statement was found.
