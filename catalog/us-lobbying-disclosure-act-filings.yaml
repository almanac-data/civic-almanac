id: us-lobbying-disclosure-act-filings
type: dataset
title: U.S. Lobbying Disclosure Act Filings (LDA.gov)
description: |
  All electronically filed federal lobbying registrations and quarterly activity reports (LD-1, LD-2) and political contribution reports (LD-203) under the Lobbying Disclosure Act, published jointly by the Secretary of the Senate and the Clerk of the House, with a REST API.
publisher: U.S. Senate Office of Public Records and Clerk of the U.S. House of Representatives
