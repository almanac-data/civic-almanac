  canonical_url: https://www.regulations.gov/
access:
  method:
  - web
  - api
  - bulk
  auth_required: true
  auth_note: The API needs a free api.data.gov key (DEMO_KEY for samples); the website and bulk download need none. The commenting API needs extra entity validation.
  rate_limit: api.data.gov rate limits; commenting API 50 requests/minute and 500/hour
format:
- json
