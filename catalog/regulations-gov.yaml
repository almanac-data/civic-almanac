id: regulations-gov
type: dataset
title: Regulations.gov Rulemaking Dockets and Public Comments
description: |
  The federal eRulemaking Program's site for regulatory dockets: proposed and final rules, supporting documents, and public comments submitted to participating federal agencies, with a bulk download tool and a public API.
publisher: U.S. eRulemaking Program (managed by the U.S. General Services Administration)
jurisdiction:
  scope: national
  country: US
topics:
- rulemaking
