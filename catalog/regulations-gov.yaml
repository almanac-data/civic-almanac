license: public-domain (US Gov work; Regulations.gov User Notice says information presented "is considered public information and may be distributed or copied"; public comments are third-party submissions)
attribution: Regulations.gov, U.S. eRulemaking Program
notes: |
  Human-verified 2026-11-01 in headless Chromium: HTTP 200. curl got a CloudFront 403 "The request could not be satisfied" (bot block, not an outage), as the issue's heads-up says the link checker does. The home page shows "What's Trending" dockets with comment deadlines in November 2026, counts of documents "Posted Recently" (e.g. "Last 7 Days 396"), and a "Bulk Data Download" section ("You can download custom filtered sets of documents", https://www.regulations.gov/bulkdownload). The footer's "API Requests" link goes to https://open.gsa.gov/api/regulationsgov/ (v4 endpoints /v4/documents, /v4/comments, /v4/dockets; "X-Api-Key ... API key from api.data.gov"). An unauthenticated request to https://api.regulations.gov/v4/documents returned 403 "API_KEY_MISSING". JSON is the API's format; the bulk download's file formats were not checked. Daily cadence reflects continuous posting by agencies.
  Licence checked 2026-11-01: the Regulations.gov User Notice (https://www.regulations.gov/user-notice) says "Information presented on this website is considered public information and may be distributed or copied." It also says "Each department and agency manages its own data within the website" and comments come from the public; "Some agencies may impose special requirements for submitting CBI or copyrighted works", so individual comments or attachments may carry the submitters' copyright. Not checked: bulk download formats, the start date of dockets.
