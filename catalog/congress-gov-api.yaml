notes: |
  Human-verified 2026-10-31: HTTP 200 for api.congress.gov. It says "Congress.gov shares its application programming interface (API) with the public" and asks users to "Sign up for an API key from api.data.gov". It documents /v3 endpoints such as GET /bill. The www.congress.gov web site returned 403 (bot protection) to curl this session; civic-almanac runs the headless checker. Two things come from the API's usual documentation and weren't checked: the daily update cadence and the xml format option.
