id: eu-transparency-register
type: dataset
title: EU Transparency Register
description: |
  The joint register of the European Parliament, Council and Commission listing 'interest representatives' (organisations, associations, groups and self-employed individuals) who seek to influence EU policy, with their declared interests, clients, and resources spent; the full list is published as a daily XML export.
publisher: European Parliament, Council of the EU and European Commission (secretariat managed by the European Commission)
