id: data-gov
type: dataset
title: Data.gov Federal Open Data Catalog (metadata)
description: |
  The US government's central metadata catalog, run by GSA: dataset records harvested from federal agencies' metadata inventories (plus some state, local and university sources), searchable on catalog.data.gov and through a public JSON API. It is an index of other publishers' datasets, not a publisher of data itself.
