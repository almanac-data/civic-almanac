notes: |
  Human-verified 2026-11-01: HTTP 200 for https://catalog.data.gov/ (and for https://data.gov/, which reads "535,252 DATASETS AVAILABLE" and "Try the next-generation Data Catalog at catalog.data.gov"). The catalog page showed "535,269 datasets available on Data.gov". This entry catalogs the metadata catalog only. The user guide (https://data.gov/user-guide/) says "Data.gov is a metadata catalog. It displays information about datasets published and maintained by individual agencies. Data.gov does not: Host or store the underlying data", and that it "automatically 'harvests' that metadata" from agency inventories required by the OPEN Government Data Act. Individual datasets belong in the catalog under their own publishers, not via this entry. API: the old CKAN action API (https://catalog.data.gov/api/3/action/package_search) returned 404 {"message":"Not Found"} on 2026-11-01. The user guide says "The catalog application provides a public JSON API; authentication is not required", documented at https://resources.data.gov/catalog-api/ (HTTP 200); https://catalog.data.gov/search?q=water&format=json returned JSON results with DCAT fields. Daily cadence is approximate: harvest schedules vary by agency ("daily/weekly/monthly").
  Licence checked 2026-11-01: Data.gov's Privacy and Website Policies (https://data.gov/privacy-policy/#licensing) say "In most cases, U.S. Federal data available through Data.gov is offered free and without restriction. Data and content created by government employees within the scope of their employment are not subject to domestic copyright protection under 17 U.S.C. § 105", and "Non-federal data available through Data.gov may have different licensing ... Check the 'Access and Use Information' section on each dataset page". The metadata is supplied by agencies and harvested; the public-domain reading applies to the federal records.
